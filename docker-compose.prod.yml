services:
  # ─── Reverse Proxy (Caddy: Automatic HTTPS & Load Balancing) ─────────────
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-admin@lokamaya.id}
    volumes:
      - ./infrastructure/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api

  # ─── Frontend: Next.js Production Build ──────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        - NEXT_PUBLIC_MAPID_API_KEY=${NEXT_PUBLIC_MAPID_API_KEY}
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      - NEXT_PUBLIC_MAPID_API_KEY=${NEXT_PUBLIC_MAPID_API_KEY}
    depends_on:
      api:
        condition: service_healthy

  # ─── Backend: Go REST API + Anthropic MCP Server ─────────────────────────
  api:
    build:
      context: ./apps/api-go
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - GO_API_PORT=8080
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lokamaya}?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - OSRM_URL=http://osrm:5000
      - LITELLM_URL=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-lokamaya-super-secret-key-change-in-production-min-32-chars}
      - JWT_EXPIRY_HOURS=${JWT_EXPIRY_HOURS:-24}
      - BCRYPT_COST=${BCRYPT_COST:-12}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ─── LiteLLM Proxy: AI Router (Gemini 1.5 Flash via AI Studio) ───────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_API_KEY}
      - GEMINI_API_KEY=${GOOGLE_AI_STUDIO_API_KEY}
      - GOOGLE_AI_STUDIO_API_KEY=${GOOGLE_AI_STUDIO_API_KEY}
    volumes:
      - ./infrastructure/docker/litellm/config.yml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml"]


  # ─── Database: PostgreSQL 16 + PostGIS + pgvector ────────────────────────
  postgres:
    build:
      context: ./infrastructure/docker/postgres
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lokamaya}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lokamaya}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Cache: Redis 7 Alpine ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ─── Routing: OSRM Foot Profile ──────────────────────────────────────────
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    volumes:
      - ./data/spatial:/data:ro

volumes:
  postgres_prod_data:
  redis_prod_data:
  caddy_data:
  caddy_config:
