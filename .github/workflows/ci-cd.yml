name: LokaMaya CI/CD Pipeline

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-build:
    name: Test & Build Go Backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: apps/api-go/go.sum

      - name: Install dependencies
        working-directory: apps/api-go
        run: go mod tidy

      - name: Run Go tests
        working-directory: apps/api-go
        run: go test -v -race ./...

      - name: Build Go API binary
        working-directory: apps/api-go
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o bin/api ./cmd/server

  frontend-check:
    name: Lint & Build Next.js Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Type check & Build Next.js
        working-directory: apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8080
          NEXT_PUBLIC_MAPID_API_KEY: ${{ secrets.NEXT_PUBLIC_MAPID_API_KEY }}
        run: npm run build

  docker-compose-validation:
    name: Validate Docker Compose Config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose
        run: docker compose config --quiet

      - name: Validate Production Docker Compose
        run: docker compose -f docker-compose.prod.yml config --quiet
