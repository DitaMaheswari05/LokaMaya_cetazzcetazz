general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  store_model_in_db: false

litellm_settings:
  cache: true
  cache_type: "redis"
  cache_params:
    host: "redis"
    port: 6379
    namespace: "litellm.cache"
    ttl: 3600
  drop_params: true
  set_verbose: false

model_list:
  - model_name: routing-llm
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: "os.environ/GEMINI_API_KEY"
      rpm: 2000
      tpm: 2000000
      timeout: 10
  - model_name: gemini-flash-latest
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: "os.environ/GEMINI_API_KEY"
      rpm: 2000
      tpm: 2000000
      timeout: 10
  - model_name: gemini-flash-lite-latest
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: "os.environ/GEMINI_API_KEY"
      rpm: 2000
      tpm: 2000000
      timeout: 10
  - model_name: gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-flash-lite-latest
      api_key: "os.environ/GEMINI_API_KEY"
      rpm: 2000
      tpm: 2000000
      timeout: 10